<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor - MarmoScans</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
    />
    <style>
      body {
        background-color: #0b0d17;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        font-family: sans-serif;
      }
      header {
        width: 100%;
        position: relative;
        top: 0;
        z-index: 1000;
        background: #0b0d17;
        border-bottom: 1px solid #333;
      }

      #manga-container {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 0;
      }
      #manga-container img {
        width: 100%;
        max-width: 1600px;
        height: auto;
        display: block;
        margin: 5px auto;
      }

      /* ESTILOS NUEVOS PARA OST */
      .ost-toast {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: rgba(90, 50, 168, 0.9);
        color: white;
        padding: 10px 20px;
        border-radius: 30px;
        transform: translateY(100px);
        transition: 0.5s;
        z-index: 2000;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }
      .ost-toast.show {
        transform: translateY(0);
      }

      .volume-control {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(22, 24, 33, 0.8);
        padding: 10px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 2000;
        border: 1px solid #333;
      }
      input[type="range"] {
        accent-color: #7c4dff;
        cursor: pointer;
      }

      .nav-footer {
        width: 90%;
        max-width: 800px;
        display: flex;
        justify-content: space-between;
        padding: 20px;
        background: #161821;
        border-radius: 10px;
        margin: 40px 0;
        border: 1px solid #333;
      }
      .nav-btn {
        color: white;
        text-decoration: none;
        font-weight: bold;
        padding: 12px 25px;
        background: #5a32a8;
        border-radius: 6px;
        transition: 0.3s;
      }
      .nav-btn:hover {
        background: #7c4dff;
      }
      .list-btn {
        background: #333;
      }
      .single-page {
        width: 100%;
        max-width: 1100px;
        margin: 15px auto;
        display: block;
      }
      .double-page {
        width: 100%;
        max-width: 1800px;
        margin: 25px auto;
        display: block;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <span class="logo-icon"><i class="fas fa-book-open"></i></span>
        <h1>MarmoScans</h1>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-link active">Inicio</a>
        <a href="https://sites.google.com/view/marmoweb/inicio" class="nav-link"
          >MarmoWeb</a
        >
        <a href="https://x.com/MarmotaSenpai" class="nav-link">Twitter</a>
        <a
          href="https://www.instagram.com/marmotasenpai/?hl=es"
          class="nav-link"
          >Instagram</a
        >
        <a href="https://www.youtube.com/@MarmotaSenpai1" class="nav-link"
          >Youtube</a
        >
      </nav>
      <button class="mobile-menu-btn">
        <span></span><span></span><span></span>
      </button>
    </header>

    <div id="manga-container">
      <h2 id="info-display" style="margin-bottom: 20px; color: #aaa">
        Cargando contenido...
      </h2>
    </div>

    <div id="ost-notification" class="ost-toast"></div>
    <div id="youtube-player" style="display: none"></div>
    <div class="volume-control">
      <span>🔊</span>
      <input type="range" id="volume-slider" min="0" max="100" value="50" />
    </div>

    <div class="nav-footer">
      <a href="#" id="prev-btn" class="nav-btn">← ANTERIOR</a>
      <a href="index.html" id="back-to-list" class="nav-btn list-btn"
        ><i class="fas fa-bars"></i
      ></a>
      <a href="#" id="next-btn" class="nav-btn">SIGUIENTE →</a>
    </div>

    <script>
      // --- LÓGICA ORIGINAL MODIFICADA ---
      const params = new URLSearchParams(window.location.search);
      const manga = params.get("manga") || "OnePiece";
      const cap = parseInt(params.get("c")) || 1;

      document.getElementById("info-display").innerText =
        `${manga.replace(/([A-Z])/g, " $1")} - Capítulo ${cap}`;
      document.title = `${manga} Cap ${cap} - MarmoScans`;

      // Define aquí el PRIMER capítulo que tienes subido de cada manga
      const primerCapituloSubido = {
        OnePiece: 1171,
        BlackClover: 381,
        Fate: 1,
        Nagatoro: 1,
        BorutoTBV: 23,
        AoNoHako: 1,
      };

      // Define aquí el ÚLTIMO capítulo disponible (el que vas actualizando)
      const limitesCapitulos = {
        OnePiece: 1182,
        BlackClover: 392,
        Fate: 7,
        Nagatoro: 95,
        BorutoTBV: 33,
        AoNoHako: 1,
      };

      // Obtener los límites específicos para el manga actual
      const inicioManga = primerCapituloSubido[manga] || 1;
      const finManga = limitesCapitulos[manga] || 1;

      // LÓGICA BOTÓN ANTERIOR
      const prevBtn = document.getElementById("prev-btn");
      if (cap <= inicioManga) {
        // Si es el primer capítulo que subiste (ej. 1171), se oculta
        prevBtn.style.visibility = "hidden";
      } else {
        prevBtn.href = `visor.html?manga=${manga}&c=${cap - 1}`;
        prevBtn.style.visibility = "visible";
      }

      // LÓGICA BOTÓN SIGUIENTE
      const nextBtn = document.getElementById("next-btn");
      if (cap >= finManga) {
        // Si es el último capítulo disponible (ej. 1182 o 392), se oculta
        nextBtn.style.visibility = "hidden";
      } else {
        nextBtn.href = `visor.html?manga=${manga}&c=${cap + 1}`;
        nextBtn.style.visibility = "visible";
      }

      // --- CONFIGURACIÓN DE MÚSICA ---
      /* prettier-ignore */
      const musicData = {
        OnePiece: {
          1182: [
            // <--- AQUÍ agregas el nuevo capítulo
            { start: 1, end: 4, id: "4EMR7ZfZzR4", title: "One Piece Ost - Black Hole",},
            { start: 5, end: 6, id: "rOEpFJrXzbM", title: "One Piece Ost - If There Are Storms, There Are Stars Too",},
            { start: 7, end: 7, id: "j6isC1-dQ_w", title: "One Piece Ost - Desperate Situation (Part 1)",},
            { start: 8, end: 11,id: "KflMVGQOMwI", title: "One Piece Ost - God Knights Theme (Fanmade)",},
            { start: 12,end: 13,id: "6s-Icke6F8M", title: "One Piece Ost - Desperate Situation",},
          ],
            
          1183:[
            { start: 3, end: 5, id: "SJi2xcGn4CM", title: "One Piece Ost - Submit Or Perish (Fanmade)",},
            { start: 6, end: 8, id: "LCg2fZHpIBQ", title: "One Piece Ost - Uunan And The Stone Storage Room",},
            { start: 9, end: 10, id: "u2V0_UnMkx8", title: "One Piece Ost - Hungry Luffy",},
            { start: 11, end: 13, id: "SeDyYtIuhsA", title: "One Piece Ost - Binks' Sake",},
            { start: 14, end: 16, id: "7FVQeJI2Q1I", title: "One Piece Ost - The Battle Continues As Long As You Live",},
          ],
          default: { id: "p19p_mSIn_k", title: "Grand Line Ambient" },
        },
        Fate: {
          1: [
            { start: 1, end: 5, id: "76vbmoP42nI", title: "Fate/GO Ost - Village/Hassan",},
            { start: 6, end: 13, id: "ZjqsvwiwXo0", title: "Hiroyuki Sawano - A34N",},
          ],

          2: [
            { start: 1, end: 11, id: "5ZoCkMkktFE", title: "Tsukihime - Track 04",},
          ],

          3: [
            { start: 1, end: 8, id: "bbEsGBb0BEk", title: "Shiro Sagisu - Sentiment actuel 01",},
          ],

          4: [
            { start: 1, end: 8, id: "U-nUfcs7UlI", title: "Fate Stay Night OST - Eien no Toga",},
            { start: 9, end: 20, id: "Biiw6MnqLwE", title: "Fate Stay Night OST - Aintsuberun No Mori",},
          ],

          5: [
            { start: 1, end: 19, id: "UuofG8a7EEk", title: "Higurashi No Naku Koro Ni OST - Main Theme",},
            { start: 19, end: 33, id: "6EXB1QwUWyA", title: "Hiroyuki Sawano - SYRINGE",},
          ],

          6: [
            {start: 1, end: 6, id: "KPEz3ikjCBU", title: "Fate UBW OST - Sanctum / Conversation",},
          ],
            
          7: [
            {start: 1, end: 9, id: "vCOTWQexTjs", title: "Whirlpool of Fate ~ Unmei no Uzu 運命の渦",},
          ],
          default: { id: "p19p_mSIn_k", title: "Fate Ambient" },
        }
      };

      let player;
      let currentSongId = null;

      // --- CARGA DINÁMICA + ASIGNACIÓN DE AUDIO ---
      const container = document.getElementById("manga-container");

      function cargarPaginas(i) {
        let p = i.toString().padStart(3, "0");
        let img = document.createElement("img");
        img.src = `Marmoscans/${manga}/${cap}/${cap}-${p}.webp`;

        img.onload = function () {
          if (this.naturalWidth > 3000) {
            this.classList.add("double-page");
          } else {
            this.classList.add("single-page");
          }

          // ASIGNAR AUDIO A LA IMAGEN SEGÚN EL RANGO
          const infoManga = musicData[manga];
          if (infoManga) {
            const configCap = infoManga[cap];
            let found = null;
            if (configCap && Array.isArray(configCap)) {
              found = configCap.find((r) => i >= r.start && i <= r.end);
            }
            const finalTrack = found || infoManga.default;
            if (finalTrack) {
              this.setAttribute("data-audio", finalTrack.id);
              this.setAttribute("data-title", finalTrack.title);
            }
          }

          container.appendChild(this);
          observer.observe(this); // Empezar a vigilar esta imagen recién cargada
          cargarPaginas(i + 1);
        };

        img.onerror = function () {
          console.log("Fin del capítulo.");
        };
      }

      // --- OBSERVADOR DE SCROLL ---
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const audioId = entry.target.getAttribute("data-audio");
              const title = entry.target.getAttribute("data-title");
              if (audioId && audioId !== currentSongId) {
                reproducirOST(audioId, title);
              }
            }
          });
        },
        { threshold: 0.3 },
      );

      // Función para mostrar el nombre de la canción en pantalla
      function mostrarToast(titulo) {
        const toast = document.getElementById("ost-notification");
        if (toast) {
          toast.innerText = `🎵 Escuchando: ${titulo}`;
          toast.classList.add("show");

          // Limpiar el temporizador anterior si existe para que no se oculte antes de tiempo
          if (window.toastTimeout) clearTimeout(window.toastTimeout);

          window.toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
          }, 4000);
        }
      }

      function reproducirOST(id, titulo) {
        if (currentSongId === id) return;
        currentSongId = id;

        if (player && player.loadVideoById) {
          // 1. Detenemos cualquier carga previa
          player.stopVideo();

          // 2. Cargamos el nuevo con un pequeño margen
          player.loadVideoById({
            videoId: id,
            startSeconds: 0,
            suggestedQuality: "small",
          });

          // 3. Forzamos el play
          player.playVideo();
          mostrarToast(titulo);
        } else {
          mostrarToast(titulo);
        }
      }

      // --- API YOUTUBE ---
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      function onYouTubeIframeAPIReady() {
        player = new YT.Player("youtube-player", {
          height: "0",
          width: "0",
          playerVars: {
            loop: 1, // Activa el bucle
            playlist: currentSongId, // Requerido por YouTube para que el loop funcione
          },
          events: {
            onReady: (event) => {
              event.target.setVolume(
                document.getElementById("volume-slider").value,
              );
            },
            onStateChange: onPlayerStateChange, // Detecta cuando termina la canción
          },
        });
      }

      // Esta función asegura que si la canción termina, se vuelva a reproducir la misma
      function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) {
          player.playVideo();
        }
      }

      document
        .getElementById("volume-slider")
        .addEventListener("input", (e) => {
          if (player) player.setVolume(e.target.value);
        });

      cargarPaginas(1);
      // Forzar el inicio del audio al primer clic o scroll si YouTube está bloqueado
      window.addEventListener(
        "mousedown",
        () => {
          if (player && player.getPlayerState() !== 1) {
            // 1 = Reproduciendo
            player.playVideo();
          }
        },
        { once: true },
      ); // Solo se ejecuta la primera vez
    </script>
  </body>
</html>
